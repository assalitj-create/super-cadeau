<style>
:root{
 --bg:#F2F8F4;--paper:#fff;--ink:#14161B;--ink-m:#66726B;--line:#DAE7DF;--field:#ECF4EF;--t:var(--ink);--m:var(--ink-m);
 --ok:#1E6B46;--okbg:#E3F2E9;--warn:#8A5600;--warnbg:#FFF1D6;--bad:#C62839;--badbg:#FCE6E9;
 --ac:#1E6B46;--ac2:#E1F1E8;--hd:#14503A;--alt:#C62839;--gold:#F3C65B;--goldink:#3B2A00;--green:#1E6B46;
 --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:var(--sans)}
body.elsa{--bg:#FDF3F4;--ink-m:#756569;--line:#F0DBDE;--field:#F9EAEC;--ac:#C62839;--ac2:#FCE6E9;--hd:#A01B2D;--alt:#1E6B46}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.foil{}
.lights{display:none}

header{position:sticky;top:0;z-index:20;background:var(--hd);color:#fff;padding-top:env(safe-area-inset-top)}
header::after{content:"";display:block;height:6px;background:repeating-linear-gradient(-45deg,#C62839 0 9px,#fff 9px 18px,#1E6B46 18px 27px,#fff 27px 36px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:880px;margin:0 auto;padding:12px 20px}
.top h1{font:800 20px/1 var(--sans);letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:8px;color:#fff}
.top h1 svg{width:36px;height:36px;flex:none;border-radius:10px}
.top h1 small{font:500 13px var(--sans);color:rgba(255,255,255,.72);margin-left:2px;letter-spacing:0}
.chip-user{display:flex;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:700;border-radius:99px;padding:4px 14px 4px 4px;cursor:pointer}
.sync{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.35);flex:none}
.sync.s-ok{background:#7DF0B0;box-shadow:0 0 0 3px rgba(125,240,176,.28)}
.sync.s-busy{background:var(--gold);animation:pulse 1s ease-in-out infinite}
.sync.s-err{background:#FF8A8A}
@keyframes pulse{50%{opacity:.3}}
.tk{display:flex;flex-direction:column;gap:6px}
.tk .tkhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tk .tkdesc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.fchips{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink-m);cursor:pointer}
.fchips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.st.recupere{background:#0E7490;color:#fff}
.st.offert{background:var(--gold);color:var(--goldink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
label.chip{display:inline-flex;align-items:center;margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:99px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;background:#fff}
label.chip input{display:none}
label.chip:has(input:checked){background:var(--ac);border-color:var(--ac);color:#fff}
.srow{display:flex;gap:14px;align-items:flex-start}
.sthumb{width:64px;height:64px;border-radius:12px;background:var(--ac2) center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ac)}
.sthumb svg{width:26px;height:26px}
.buyline{font-size:13px;color:var(--ink);background:var(--field);border-radius:8px;padding:6px 10px;margin-top:4px}
.hist{list-style:none;padding:0;margin:0 0 6px;font-size:13px;color:var(--ink-m)}
.hist li{padding:5px 0;border-top:1px solid var(--line)}
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;color:var(--ink);font-size:15px}
.opt input{width:auto;margin:4px 0 0}
.opt small{display:block;font-weight:400;font-size:13px;color:var(--ink-m)}
.opt:has(input:checked){border-color:var(--ac);background:var(--ac2)}
.lock{display:inline-flex;align-items:center;gap:4px}
.lock svg{width:13px;height:13px}
.steps{padding-left:20px;margin:0 0 14px}.steps li{margin-bottom:8px}
.chip-user i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--hd);display:flex;align-items:center;justify-content:center;font-size:13px}

main{max-width:880px;margin:0 auto;padding:24px 20px}
h2{font:800 30px/1.1 var(--sans);letter-spacing:-.025em;margin:0 0 20px}
h3{font:700 17px/1.2 var(--sans);letter-spacing:-.01em;margin:30px 0 12px}
.sub{color:var(--ink-m);font-size:13px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(.94)}
.btn.sec{background:var(--ac2);color:var(--ac)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.link{border:0;background:none;color:var(--ink-m);cursor:pointer;font-size:13px;font-weight:500;padding:4px 6px}
.link:hover{color:var(--ac);text-decoration:underline}

.stats{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:6px}
.stat{flex:1;padding:14px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font:800 24px/1.15 var(--sans);letter-spacing:-.02em;color:var(--ac)}
.stat span{font-size:13px;color:var(--ink-m)}

.pcard{display:flex;gap:16px;align-items:center;width:100%;text-align:left;cursor:pointer;transition:border-color .15s}
.pcard:hover{border-color:var(--ac)}
.thumbs{display:flex;flex:none}
.thumbs i{width:48px;height:48px;border-radius:50%;border:3px solid #fff;margin-left:-14px;background:var(--ac2) center/cover;display:flex;align-items:center;justify-content:center;color:var(--ac);overflow:hidden}
.thumbs i:first-child{margin-left:0}
.thumbs svg{width:22px;height:22px}
.pname{font:700 18px/1.2 var(--sans);letter-spacing:-.01em}
.pmeta{font-size:13px;color:var(--ink-m);margin-top:2px}
.bar{height:6px;background:var(--field);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.bar i.over{background:#E8710A}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gift{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.gimg{aspect-ratio:4/3;position:relative;background:var(--ac2);display:flex;align-items:center;justify-content:center;color:var(--ac)}
.gimg>svg{width:40px;height:40px;opacity:.55}
.gimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.tagw{position:absolute;left:10px;bottom:10px}
.tag{display:inline-block;background:var(--gold);color:var(--goldink);font-weight:800;font-size:14px;padding:4px 12px;border-radius:99px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tag.none{background:#fff;color:var(--ink-m);font-weight:600}
.st{position:absolute;left:10px;top:10px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.st.choisi{background:var(--alt);color:#fff}
.st.achete{background:var(--green);color:#fff}
.gbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.gtitle{font:700 16px/1.3 var(--sans);letter-spacing:-.01em;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--ink-m)}
.meta b{color:var(--ink);font-weight:600}
.glink{font-size:13px;color:var(--ac);overflow-wrap:anywhere;text-decoration:none;font-weight:500}
.glink:hover{text-decoration:underline}
.gact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.seg{display:inline-flex;background:var(--field);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-m);border-radius:8px}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.like{border:0;background:var(--field);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink-m);font-weight:500}
.like.on{background:var(--badbg);color:var(--bad)}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--ac2);color:var(--ac);font-weight:700}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:150px;border:0;background:transparent;padding:9px 1px 8px;cursor:pointer;color:var(--ink-m);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--ac);font-weight:700;position:relative}
nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--gold)}

label{display:block;font-size:13px;font-weight:500;color:var(--ink-m);margin-bottom:12px}
input,select,textarea{width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:transparent}
input[type=checkbox],input[type=radio]{accent-color:var(--ac)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inl{display:flex;gap:8px;align-items:flex-end}
.inl .btn{white-space:nowrap;height:44px}
.pv{font-size:13px;color:var(--ink-m);margin-bottom:12px}
.pv img{display:block;width:100%;max-height:200px;object-fit:contain;background:var(--field);border-radius:12px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(20,22,27,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:26px 20px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(90deg,#C62839 0 33.3%,var(--gold) 33.3% 66.6%,#1E6B46 66.6%) top/100% 5px no-repeat,#fff}
.sheet h2{font-size:24px;margin-bottom:18px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:22px}}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--hd);color:#fff;font-weight:600;padding:11px 18px;border-radius:99px;font-size:14px;z-index:60;max-width:90vw;border-bottom:3px solid var(--gold)}
.empty{text-align:center;color:var(--ink-m);padding:44px 16px}
.empty svg{width:44px;height:44px;color:var(--gold);margin-bottom:10px}
.table{width:100%;border-collapse:collapse}
.table td,.table th{padding:10px 4px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
.table th{font-size:13px;color:var(--ink-m);font-weight:500}
.table tfoot td{border-bottom:0;border-top:2px solid var(--gold)}
.num{width:104px}
.gprice{font-weight:800;color:var(--ac)}

.who{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.who button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:32px 12px 26px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:16px;font:700 18px var(--sans);color:var(--ink);transition:border-color .15s}
.who button:hover{border-color:var(--c)}
.who button i{font-style:normal;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 30px var(--sans);color:#fff;background:var(--c)}
.who .j{--c:#1E6B46}.who .e{--c:#C62839}
.share-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.share-row input{margin:0;padding:8px 10px;width:104px}
.share-row label{margin:0;display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.share-row input[type=checkbox]{width:auto;margin:0}
.amt{font:800 20px/1 var(--sans);letter-spacing:-.02em}
textarea.code{font:12px/1.3 ui-monospace,Menlo,monospace;min-height:90px}
.balance{background:var(--gold);color:var(--goldink);border-radius:14px;padding:14px 18px;font-weight:800;margin-bottom:16px}
.note{font-size:13px;color:var(--ink-m);margin:0 0 16px}
/* ===== Corrections de tableau et d'alerte ===== */
.card:has(.table){padding:12px 8px;overflow-x:auto}
.table{table-layout:auto}.table td,.table th{padding:8px 2px;font-size:12.5px;vertical-align:middle}
.table th{font-weight:800;color:#111}
.table .num{width:64px;min-width:0;padding:7px 5px;margin:0;font-size:14px}
.table .badge{font-size:11.5px;padding:0 5px;border-width:1.5px;white-space:nowrap}
.table .num{width:60px}.table td:first-child{max-width:84px}
@media(max-width:380px){.table td,.table th,.table tfoot td{font-size:11.5px;padding:8px 1px}.table .num{width:54px;padding:6px 3px}.table .badge{font-size:11px}.table td:first-child{max-width:72px}}
.table td:first-child{overflow-wrap:break-word;word-break:normal;min-width:62px;max-width:96px;font-size:13px}
.table tfoot td{font-size:13px;white-space:nowrap}
.alert{background:#FAD0D5;color:#111;border:2px solid #111;border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px;margin:0 0 10px}.alert[hidden]{display:none}
.badge.shared{background:var(--ac2)}.badge.lock{padding:3px 10px 3px 8px;font-size:13px}.badge.lock svg{width:15px;height:15px}.badge.lock{gap:5px;align-items:center}
.stat{min-width:0;padding:12px 12px}.stat b{font-size:20px;white-space:nowrap}.stat span{display:block;overflow-wrap:anywhere}.stats{overflow:hidden}
body.andrea{--ac:#2B59C3;--ac2:#DCE6FA;--alt:#1E7A52}

/* ---- Vote d'arbitrage : classement du préféré au moins préféré (méthode Borda) ---- */
let voteDraft = null;
const voteGet = id => S.votes[id] ? Object.assign({ id }, S.votes[id]) : null;
const openVoteOf = pid => live('votes').filter(v => v.pid === pid && v.status === 'open').sort((a, b) => (b.c || 0) - (a.c || 0))[0] || null;
const voteCands = v => (v.cands || []).filter(id => S.gifts[id] && !S.gifts[id].d);
const ballotOf = (vid, u) => { const b = S.ballots[vid + '|' + u]; return b && !b.d && Array.isArray(b.r) ? b : null; };
function tieIdeas(pid) {
  const mem = membersOf(pid); if (isSolo(pid) || mem.length < 3) return null;
  const ideas = giftsOf(pid).filter(g => g.status === 'idee'); if (ideas.length < 2) return null;
  const cnt = g => mem.filter(u => likedBy(g.id, u)).length, top = Math.max(...ideas.map(cnt)); if (top < 1) return null;
  const tied = ideas.filter(g => cnt(g) === top); return tied.length >= 2 ? tied : null;
}
function fullRank(v, r) { const c = voteCands(v), o = (r || []).filter(id => c.includes(id)); c.forEach(id => { if (!o.includes(id)) o.push(id); }); return o; }
function voteScore(v) {
  const mem = membersOf(v.pid), c = voteCands(v), n = c.length, pts = {}, first = {};
  c.forEach(id => { pts[id] = 0; first[id] = 0; });
  let cnt = 0;
  mem.forEach(u => { const b = ballotOf(v.id, u); if (!b) return; cnt++; fullRank(v, b.r).forEach((id, i) => { pts[id] += n - 1 - i; if (i === 0) first[id]++; }); });
  const ordered = c.slice().sort((a, b) => (pts[b] - pts[a]) || (first[b] - first[a]));
  const top = ordered[0], tied = ordered.filter(id => pts[id] === pts[top] && first[id] === first[top]);
  return { pts, first, ordered, cnt, total: mem.length, complete: cnt === mem.length || !!v.forced, tied, max: Math.max(1, (n - 1) * Math.max(cnt, 1)) };
}

function voteResultView(vid) {

async function shrinkImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    for (const [max, q] of [[480, .72], [400, .65], [320, .6], [260, .55], [200, .5]]) {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/jpeg', q); if (d.length < 32000) return d;
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}

async function runPreview(force) {

  } else if (f.elements.price.value === '') notes.push('Prix non trouvé : saisis-le à la main.');
  if (!f.elements.img.value.trim()) {
    const m = url.match(/\/(?:dp|gp\/product|gp\/aw\/d|product)\/([A-Z0-9]{10})(?:[/?#]|$)/i);
    if (m && /amazon\.|amzn\./i.test(url)) { const u = `https://m.media-amazon.com/images/P/${m[1].toUpperCase()}.01._SCLZZZZZZZ_.jpg`; f.elements.img.value = u; f.elements.imgurl.value = u; }
  }

}

ut[c][id] = rec;\n            var row = [c, id, rec.u || 0, JSON.stringify(rec)], k = c + '|' + id;\n            if (idx[k]) upd.push([idx[k], row]); else add.push(row);\n          }\n        });\n      });\n      upd.forEach(function (x) { sh.getRange(x[0], 1, 1, 4).setValues([x[1]]); });\n      if (add.length) sh.getRange(sh.getLastRow() + 1, 1, add.length, 4).setValues(add);\n    }\n    return { ok: true, data: out, t: Date.now() };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction reply_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction doGet(e) {\n  if (e && e.parameter && e.parameter.preview) {\n    // Lecture d'une page produit (titre, image, prix) pour l'appli\n    try {\n      var r = UrlFetchApp.fetch(e.parameter.preview, { followRedirects: true, muteHttpExceptions: true,\n        headers: { 'User-Agent': 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36', 'Accept-Language': 'fr-FR,fr;q=0.9' } });\n      return reply_({ ok: true, html: r.getContentText().slice(0, 400000), url: e.parameter.preview });\n    } catch (err) { return reply_({ ok: false, error: String(err) }); }\n  }\n  try { return reply_(handle_(null)); } catch (err) { return reply_({ ok: false, error: String(err) }); }\n}\n\nfunction doPost(e) {\n  try {\n    var body = JSON.parse(e.postData.contents);\n    return reply_(handle_(body && body.data ? body.data : null));\n  } catch (err) { return reply_({ ok: false, error: String(err) }); }\n}\n";
const SYNC_KEY = 'cadeaux.sync';
const SYNC_LABEL = { off: 'Synchronisation désactivée', busy: 'Synchronisation…', ok: 'Synchronisé', err: 'Hors ligne ou erreur de synchronisation' };
let syncErrMsg = '';
// Adresse du serveur de synchro intégrée à l'application : quand elle est renseignée, tout est automatique et rien n'est affiché à l'utilisateur.
const DEFAULT_SYNC = 'https://script.google.com/macros/s/AKfycbxEWJLfqwKSxw3dZwcInOQE5-i7xlyqy2SEK-hxuzBrNz6XqFuo4pAV_Zt2UYXoWEkW/exec';
let syncUrl = DEFAULT_SYNC; try { syncUrl = DEFAULT_SYNC || localStorage.getItem(SYNC_KEY) || ''; } catch (e) {}
let inviteToast = false;
try {
  const m = location.hash.match(/^#sync=(.+)$/);
  if (m) { const u = decodeURIComponent(m[1]); if (/^https:\/\/script\.google\.com\/.+\/exec/.test(u)) { syncUrl = u; localStorage.setItem(SYNC_KEY, u); inviteToast = true; } history.replaceState(null, '', location.pathname + location.search); }
} catch (e) {}
let syncState = syncUrl ? 'busy' : 'off', syncAt = null, syncTimer = null, syncBusy = false, syncAgain = false, pendingRender = false;
function setSync(st) {
  syncState = st;
  ['#syncdot', '#syncdot2'].forEach(s => { const d = $(s); if (d) { d.className = 'sync s-' + st; d.title = SYNC_LABEL[st]; } });
  const t = $('#synctxt'); if (t) t.textContent = SYNC_LABEL[st];
}
function maybeRender() {
  const a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if (!$('#modal').hidden || typing) { pendingRender = true; return; }
  render();
}
function scheduleSync() { if (!syncUrl) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), 700); }
async function syncNow(manual) {
  if (!syncUrl) return;
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true; setSync('busy');
  try {
    const r = await fetch(syncUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ data: sharedState(true) }) });
    const j = await r.json();
    if (!j || !j.ok || !j.data) throw new Error((j && j.error) || 'réponse invalide');
    const n = merge(j.data, true); syncAt = new Date(); syncedOnce = true; setSync('ok'); gateRefresh();
    if (n) maybeRender(); else if (manual) { toast('Connecté, déjà à jour'); if (view === 'sync') render(); }
  } catch (e) { syncErrMsg = String(e && e.message || e); setSync('err'); gateRefresh(); if (manual) toast('Synchronisation impossible : ' + syncErrMsg.slice(0, 120)); }
  syncBusy = false;
  if (syncAgain) { syncAgain = false; scheduleSync(); }
}
async function pollSync() {
  if (!syncUrl || syncBusy || document.hidden || !$('#modal').hidden) return;
  syncBusy = true;
  try {
    const r = await fetch(syncUrl), j = await r.json();
    if (!j || !j.ok || !j.data) throw new Error((j && j.error) || 'réponse invalide');
    const n = merge(j.data, true); syncAt = new Date(); syncedOnce = true; setSync('ok'); gateRefresh(); if (n) maybeRender();
  } catch (e) { setSync('err'); gateRefresh(); }
  syncBusy = false;
}
setInterval(pollSync, 6000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollSync(); });
window.addEventListener('online', () => syncNow(false));
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (pendingRender && $('#modal').hidden && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) { pendingRender = false; render(); } }, 150));
/* ---- Écran d'ouverture : cadeau + éclair (première ouverture ou reconnexion) ---- */
const SLOGAN = 'Même le Père Noël est jaloux';
function showSplash() {
  if (document.getElementById('splash')) return;
  const el = document.createElement('div'); el.id = 'splash'; el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'Super Cadeau, powered by A&J Company');
  const sparks = [[-46, -40], [48, -34], [-58, 6], [60, 12], [-30, 52], [34, 56], [4, -58], [70, -10]].map(d => `<i class="sp-s" style="--dx:${d[0]}px;--dy:${d[1]}px"></i>`).join('');
  el.innerHTML = `<div class="sp-box"><svg class="sp-logo" viewBox="0 0 100 100" aria-hidden="true"><rect class="sp-tile" width="100" height="100" rx="22" fill="#FFF1D6"/><g class="sp-gift"><rect class="sp-l sp-l1" pathLength="1" x="22" y="52" width="56" height="36" rx="4"/><rect class="sp-l sp-l2" pathLength="1" x="16" y="42" width="68" height="12" rx="3"/><line class="sp-l sp-l3" pathLength="1" x1="50" y1="42" x2="50" y2="88"/></g><polygon class="sp-bolt" points="62,8 36,48 49,48 40,80 72,36 57,36 66,8"/></svg>${sparks}</div><div class="sp-t">Super Cadeau</div><div class="sp-sl">${esc(SLOGAN)}</div><div class="sp-p">Powered by <b>A&amp;J Company</b></div><div class="sp-fl"></div>`;
  document.body.appendChild(el);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  let done = false;
  const end = () => { if (done) return; done = true; el.classList.add('out'); setTimeout(() => { el.remove(); const i = document.querySelector('input[name=pw]'); if (i && !('ontouchstart' in window)) i.focus(); }, 480); };
  el.addEventListener('click', end);
  setTimeout(end, 3200);
}
render();
showSplash();
if (inviteToast) toast('Synchronisation automatique activée');
if (syncUrl) syncNow(false);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
